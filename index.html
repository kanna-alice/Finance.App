<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Finanças</h1>
        <p> <input type="text" id="searchInput" placeholder="Pesquisar..."><button id="searchButton">Pesquisar</button>  <button id="button_Menu" onclick="Menu()">Abrir Menu</button>
            <div id="Add">
                <h1>Adicionar Conta</h1> <p><button onclick="Menu()">Fechar</button></p>
                <input id="input_Add" placeholder="Informe o que deseja adicionar"></input><button id="button_Add" onclick="Adicionar()">Adicionar</button>
            </div>
        </div>
    <div class="container_finance">
        <table id="financeTable">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="financeTableBody">
                <!-- As linhas da tabela serão preenchidas dinamicamente -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total</td>
                    <td id="totalValue">R$ 0,00</td>
                </tr>
            </tfoot>
        </table>
</body>
<script src="script.js"></script>
</html>
